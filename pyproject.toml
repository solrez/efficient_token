[project]
name = "token-efficient-agent"
version = "0.1.0"
description = "Token efficiency optimization framework for agentic AI systems"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain>=1.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langfuse>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "setuptools>=68.0",
]

[project.scripts]
tea = "token_efficient_agent.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
